[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-idee-server"
version = "0.1.0"
description = "Servidor Django compatible con el cliente API-IDEE 1.1.0 y con API canónica OGC"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "Django>=6.1,<6.2",
    "django-ninja>=1.7,<2",
    "django-cors-headers>=4.9,<5",
    "django-environ>=0.14,<1",
    "httpx>=0.28,<1",
    "pyproj>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "PyYAML>=6,<7",
    "respx>=0.23,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: pruebas de contrato contra OpenAPI",
    "golden: comparación contra el servidor heredado",
    "security: pruebas de seguridad (SSRF, XSS, inyección)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["static", "docs", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "DJ", "RUF", "S", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"config/settings/*" = ["F403", "F405", "S105"]
"apps/*/migrations/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["apps", "config"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["migrations"]
